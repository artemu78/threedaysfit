name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend for the repository subpath
        run: npm run build:client
        env:
          VITE_BASE_PATH: /threedaysfit/
          # Public browser configuration; these values are not secrets.
          VITE_GOOGLE_CLIENT_ID: 107916257043-3aevfkqadmi1lr2en0do36spka72gjt5.apps.googleusercontent.com
          VITE_FIRESTORE_PROJECT_ID: days-fit-471521

      - name: Add SPA fallback for direct links
        run: cp dist/public/index.html dist/public/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
